<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management CRUD</title>

    <!-- Bootstrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary">Contact Management CRUD</h1>
        <form id="contactForm">
            <div class="row my-5">
                <input type="text" id="editStatus" hidden>
                <div class="col-lg-4">
                    <input id="contactName" type="text"
                        placeholder="Contact Name" class="form-control">
                </div>
                <div class="col-lg-4">
                    <input id="contactNumber" type="text"
                        placeholder="Phone Number" class="form-control">
                </div>
                <div class="col-lg-4">
                    <input id="contactEmail" type="email"
                        placeholder="Email Address" class="form-control">
                </div>
                <div class="col-lg-4 mt-3">
                    <button type="submit" class="btn btn-success w-100">
                        Add Contact
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="row my-5">
                <div class="col-lg-12">
                    <input id="searchContact" type="text"
                        placeholder="Search contact by name"
                        class="form-control">
                </div>
            </div>
        </form>

        <!--  Table -->
        <table class="table table-bordered table-hover text-center">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Email </th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
    <script src="./main.js"></script>
</body>
</html>
